
name: Build SkyLyrics Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Find Gradle project
        run: |
          find . -maxdepth 4 \( -name build.gradle -o -name build.gradle.kts \)

      - name: Build mod
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          elif [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            gradle build
          else
            echo "No Gradle wrapper found in repository root."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyLyrics-Mod
          path: '**/build/libs/*.jar'
