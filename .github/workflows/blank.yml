name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Locate and Build Project
        run: |
          # Find where build.gradle lives in the repository
          GRADLE_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          echo "Found project directory at: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          # Force generate wrapper scripts locally on the cloud runner
          gradle wrapper --gradle-version 9.2.0
          chmod +x gradlew
          
          # Run the build
          ./gradlew build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: NeonLyrics-Fabric-Mod
          path: "**/build/libs/*.jar"


